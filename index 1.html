<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Cats Walk on Hiro Marker</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script>
AFRAME.registerComponent('walk-cat', {
 schema:{speed:{default:0.01},startX:{default:-2},endX:{default:2}},
 init:function(){this.el.object3D.position.x=this.data.startX;},
 tick:function(){let p=this.el.object3D.position;p.x+=this.data.speed;if(p.x>this.data.endX){p.x=this.data.startX;}}
});
</script>
</head>
<body style="margin:0;overflow:hidden;">
<a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false">
<a-assets>
<a-asset-item id="catModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
</a-assets>
<a-marker preset="hiro">
<a-entity gltf-model="#catModel" animation-mixer="clip:*" scale="0.02 0.02 0.02" rotation="0 90 0" walk-cat="speed:0.01;startX:-2;endX:2"></a-entity>
<a-entity gltf-model="#catModel" animation-mixer="clip:*" position="0 0 -0.5" scale="0.018 0.018 0.018" rotation="0 90 0" walk-cat="speed:0.015;startX:-2.5;endX:2"></a-entity>
<a-entity gltf-model="#catModel" animation-mixer="clip:*" position="0 0 0.5" scale="0.022 0.022 0.022" rotation="0 90 0" walk-cat="speed:0.02;startX:-3;endX:2"></a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
</body>
</html>
